version: "3.9"

networks:
  nexusflow_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

x-common-env: &common-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: nexusflow
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusflow_dev}
  POSTGRES_DB: nexusflow
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_OPENAI_MODEL: ${LLM_MODEL:-gpt-4o}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-agent-defaults: &agent-defaults
  build:
    context: .
    dockerfile: infra/Dockerfile.agent
  restart: unless-stopped
  networks:
    - nexusflow_net
  environment:
    <<: *common-env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
    interval: 30s
    timeout: 10s
    retries: 3

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexusflow-postgres
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusflow_dev}
      POSTGRES_DB: nexusflow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusflow -d nexusflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: nexusflow-redis
    restart: unless-stopped
    networks:
      - nexusflow_net
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile.gateway
    container_name: nexusflow-gateway
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      <<: *common-env
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8000"
      GATEWAY_JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  streaming:
    build:
      context: .
      dockerfile: infra/Dockerfile.streaming
    container_name: nexusflow-streaming
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      <<: *common-env
      STREAMING_PORT: "8001"
      GATEWAY_JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: .
      dockerfile: infra/Dockerfile.orchestrator
    container_name: nexusflow-orchestrator
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      <<: *common-env
      ORCHESTRATOR_MAX_CONCURRENT_SUBTASKS: "10"
      ORCHESTRATOR_MAX_RETRIES: "3"
      ORCHESTRATOR_TASK_TIMEOUT_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  planner:
    build:
      context: .
      dockerfile: infra/Dockerfile.planner
    container_name: nexusflow-planner
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-retriever:
    <<: *agent-defaults
    container_name: nexusflow-retriever-1
    environment:
      <<: *common-env
      AGENT_TYPE: retriever
    command: python -m nexusflow.agents.runner

  worker-analyzer:
    <<: *agent-defaults
    container_name: nexusflow-analyzer-1
    environment:
      <<: *common-env
      AGENT_TYPE: analyzer
    command: python -m nexusflow.agents.runner

  worker-writer:
    <<: *agent-defaults
    container_name: nexusflow-writer-1
    environment:
      <<: *common-env
      AGENT_TYPE: writer
    command: python -m nexusflow.agents.runner

  worker-validator:
    <<: *agent-defaults
    container_name: nexusflow-validator-1
    environment:
      <<: *common-env
      AGENT_TYPE: validator
    command: python -m nexusflow.agents.runner

  worker-planner-agent:
    <<: *agent-defaults
    container_name: nexusflow-planner-agent-1
    environment:
      <<: *common-env
      AGENT_TYPE: planner
    command: python -m nexusflow.agents.runner

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: nexusflow-dashboard
    restart: unless-stopped
    networks:
      - nexusflow_net
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    ports:
      - "3001:3000"
    depends_on:
      - gateway
      - streaming
