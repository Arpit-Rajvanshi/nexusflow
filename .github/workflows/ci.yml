name: NexusFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend: Lint + Type Check ──────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        working-directory: nexusflow
        run: pip install -r requirements-dev.txt && pip install -e .

      - name: Ruff lint
        working-directory: nexusflow
        run: ruff check nexusflow/

      - name: Black format check
        working-directory: nexusflow
        run: black --check nexusflow/

      - name: mypy type check
        working-directory: nexusflow
        run: mypy nexusflow/ --ignore-missing-imports

  # ─── Backend: Unit Tests ─────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusflow
          POSTGRES_PASSWORD: nexusflow_test
          POSTGRES_DB: nexusflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: nexusflow_test
      POSTGRES_DB: nexusflow_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ENVIRONMENT: development
      LLM_PROVIDER: openai
      LLM_OPENAI_API_KEY: sk-test-fake-key-for-tests
      GATEWAY_JWT_SECRET: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: nexusflow
        run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .

      - name: Run database migrations
        working-directory: nexusflow
        run: alembic upgrade head

      - name: Run unit tests
        working-directory: nexusflow
        run: pytest tests/unit/ -v --cov=nexusflow --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: nexusflow/coverage.xml
          fail_ci_if_error: false

  # ─── Frontend: Lint + Build ───────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nexusflow/apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: nexusflow/apps/dashboard
        run: npm ci

      - name: Next.js build
        working-directory: nexusflow/apps/dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8001

  # ─── Docker: Build Images ────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        working-directory: nexusflow
        run: |
          docker build -f infra/Dockerfile.gateway -t nexusflow/gateway:${{ github.sha }} .

      - name: Build orchestrator image
        working-directory: nexusflow
        run: |
          docker build -f infra/Dockerfile.orchestrator -t nexusflow/orchestrator:${{ github.sha }} .

      - name: Build agent image
        working-directory: nexusflow
        run: |
          docker build -f infra/Dockerfile.agent -t nexusflow/agent:${{ github.sha }} .

  # ─── Security Scan ───────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        working-directory: nexusflow
        run: bandit -r nexusflow/ -ll --exclude nexusflow/tests
        continue-on-error: true  # Don't fail CI for now — track as warnings
